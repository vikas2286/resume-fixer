# Render Blueprint - deploy the full Resume Fixer stack with one file.
# Backend = Web Service (Docker), Frontend = Static Site (Vite build).
# Usage: connect this repo to Render -> Blueprint -> "New Blueprint Instance"
# then set the secret env vars (GEMINI_API_KEY etc.) in the Render dashboard.
services:
  - type: web
    name: resume-fixer-backend
    runtime: docker
    # Paths are repo-root-relative.  The observed error ('open Dockerfile:
    # no such file or directory') proved Render resolved the Dockerfile
    # against the REPO ROOT (not rootDir) for docker builds, so point both
    # the Dockerfile and the build context explicitly at backend/.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Secrets are injected by the host - NEVER commit them.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TIMEOUT
        value: "60"
      # Allow the deployed frontend's domain to call this API (CORS).
      - key: ALLOWED_ORIGINS
        value: https://resume-fixer-frontend.onrender.com

  - type: web
    name: resume-fixer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Build-time var consumed by src/api/client.js (import.meta.env.VITE_API_URL).
      # REAL backend URL confirmed on the Render dashboard (subdomain is globally
      # unique; the canonical name was taken by an unrelated app).
      - key: VITE_API_URL
        value: https://resume-fixer-backend-mib0.onrender.com
